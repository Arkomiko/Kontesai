services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kontesai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kontesai}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # web and api services will be added together with the apps

volumes:
  db-data:
